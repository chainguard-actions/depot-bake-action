name: Test sbom-dir input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create minimal docker-bake.hcl and sbom output dir
        run: |
          cat > /tmp/docker-bake.hcl <<'EOF'
          target "default" {
            dockerfile-inline = "FROM alpine:3.18\nRUN echo hello"
          }
          EOF
          mkdir -p /tmp/sbom-output

      - id: action
        uses: .
        continue-on-error: true
        with:
          sbom: 'true'
          sbom-dir: /tmp/sbom-output
          files: /tmp/docker-bake.hcl
          workdir: .

      - name: Assert action ran (sbom-dir input accepted)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with sbom-dir input"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
