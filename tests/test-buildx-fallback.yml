name: Test buildx-fallback enabled
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a minimal docker-bake.hcl
        run: |
          cat > "$GITHUB_WORKSPACE/docker-bake.hcl" <<'EOF'
          group "default" {
            targets = ["app"]
          }
          target "app" {
            dockerfile-inline = "FROM scratch"
            tags = ["myapp:latest"]
          }
          EOF

      - name: Set up Docker Buildx
        run: |
          docker buildx create --use --name test-builder || true

      - id: action
        uses: .
        continue-on-error: true
        with:
          buildx-fallback: 'true'
          # No token — depot bake will fail, then it should fall back to docker buildx bake

      - name: Assert action ran with buildx-fallback
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # With buildx-fallback=true, the action may succeed via docker buildx bake
          # or fail if docker buildx bake also fails (e.g., no registry to push to)
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded via buildx fallback"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (fallback also failed or no depot token)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
