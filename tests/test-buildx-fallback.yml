name: Test buildx fallback
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Docker Buildx
        run: |
          docker buildx create --use --name test-builder || true

      - name: Create minimal bake file
        run: |
          mkdir -p /tmp/bake-test
          cat > /tmp/bake-test/docker-bake.hcl <<'EOF'
          group "default" {
            targets = ["app"]
          }
          target "app" {
            dockerfile-inline = "FROM alpine:3.18\nRUN echo hello"
            tags = ["test-app:latest"]
          }
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          files: /tmp/bake-test/docker-bake.hcl
          buildx-fallback: 'true'
          load: 'true'
          # No depot token — should fall back to docker buildx bake

      - name: Assert action ran (fallback or graceful failure)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (buildx fallback worked)"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (fallback also failed or depot error)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
