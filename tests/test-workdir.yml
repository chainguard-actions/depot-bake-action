name: Test workdir input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create bake file in a subdirectory
        run: |
          mkdir -p /tmp/myapp
          cat > /tmp/myapp/docker-bake.hcl <<'EOF'
          group "default" {
            targets = ["app"]
          }
          target "app" {
            dockerfile-inline = "FROM alpine:3.18\nRUN echo workdir-test"
            tags = ["workdir-test:latest"]
          }
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          workdir: /tmp/myapp
          # No depot token — action should fail gracefully

      - name: Assert action ran and failed gracefully (no Depot token)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully as expected (no Depot token)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (Depot credentials available)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
