name: Test custom bake file input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create custom bake definition file
        run: |
          mkdir -p "$GITHUB_WORKSPACE/build"
          cat > "$GITHUB_WORKSPACE/build/custom.hcl" <<'EOF'
          group "default" {
            targets = ["myapp"]
          }

          target "myapp" {
            context = "."
            dockerfile-inline = "FROM alpine:3.18\nRUN echo custom-bake"
            tags = ["myapp:custom"]
          }
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          project: ''
          token: ''
          files: 'build/custom.hcl'
          buildx-fallback: 'true'
          load: 'true'

      - name: Assert action ran with custom bake file
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with custom bake file"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected without Depot credentials)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
