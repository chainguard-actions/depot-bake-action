name: Test - Workdir input is respected
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Depot CLI
        run: |
          if ! command -v depot > /dev/null 2>&1; then
            curl -L https://depot.dev/install-cli.sh | DEPOT_INSTALL_DIR=/usr/local/bin sh
          fi
          depot version

      - name: Set up Docker Buildx
        run: |
          docker buildx version
          docker buildx inspect --bootstrap || docker buildx create --use --bootstrap

      - id: action
        uses: .
        with:
          workdir: tests/fixtures
          buildx-fallback: 'true'
          project: nonexistent-project-id
          token: invalid-token-for-testing
        continue-on-error: true

      - name: Assert action ran with workdir input
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should attempt to run with the specified workdir.
          # With buildx-fallback=true, depot fails (invalid token), then docker buildx bake
          # runs in the workdir which contains docker-bake.hcl.
          # Either success (fallback worked) or failure is acceptable as long as the action ran.
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded via buildx fallback with workdir"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran and failed gracefully with workdir input"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
