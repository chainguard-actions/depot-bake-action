name: Test - No Depot CLI installed
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Shadow depot with a failing stub
        run: |
          # Create a directory that will be prepended to PATH
          mkdir -p /tmp/fake-bin
          # Create a stub that always exits non-zero (simulates depot not found)
          printf '#!/bin/sh\nexit 127\n' > /tmp/fake-bin/depot
          chmod +x /tmp/fake-bin/depot
          echo "/tmp/fake-bin" >> "$GITHUB_PATH"

      - id: action
        uses: .
        with:
          project: test-project
          token: fake-token-for-test
        continue-on-error: true

      - name: Assert action failed because depot CLI is not installed
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when depot CLI is not installed, got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when depot CLI is not installed"
