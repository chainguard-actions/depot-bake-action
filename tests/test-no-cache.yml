name: Test no-cache and pull options
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create minimal docker-bake.hcl
        run: |
          cat > "$GITHUB_WORKSPACE/docker-bake.hcl" <<'EOF'
          group "default" {
            targets = ["nocache"]
          }

          target "nocache" {
            context = "."
            dockerfile-inline = "FROM alpine:3.18\nRUN echo no-cache-test"
            tags = ["nocache:test"]
          }
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          project: ''
          token: ''
          no-cache: 'true'
          pull: 'true'
          buildx-fallback: 'true'
          load: 'true'

      - name: Assert action ran with no-cache and pull options
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with no-cache and pull options"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected without Depot credentials)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
