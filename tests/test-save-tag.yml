name: Test save-tag input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create minimal docker-bake.hcl
        run: |
          cat > /tmp/docker-bake.hcl <<'EOF'
          target "default" {
            dockerfile-inline = "FROM alpine:3.18\nRUN echo hello"
          }
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          save: 'true'
          save-tag: myimage:test
          files: /tmp/docker-bake.hcl
          workdir: .

      - name: Assert action ran (save-tag input accepted)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with save-tag input"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
