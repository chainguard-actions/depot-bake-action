name: Test files input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create named bake definition files
        run: |
          cat > "$GITHUB_WORKSPACE/base.hcl" <<'EOF'
          target "base" {
            dockerfile-inline = "FROM alpine:3.18"
          }
          EOF

          cat > "$GITHUB_WORKSPACE/app.hcl" <<'EOF'
          target "app" {
            inherits = ["base"]
            tags = ["myapp:latest"]
          }
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          files: |
            base.hcl
            app.hcl
          targets: 'app'
          push: 'false'
          load: 'false'

      - name: Assert action ran with explicit files input (fails gracefully without Depot token)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully as expected (no Depot token/project)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
