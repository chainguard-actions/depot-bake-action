name: Test provenance, sbom, and sbom-dir inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create sbom output directory
        run: mkdir -p /tmp/sbom-output
      - id: action
        uses: .
        continue-on-error: true
        with:
          provenance: 'true'
          sbom: 'true'
          sbom-dir: /tmp/sbom-output
          token: fake-depot-token
          project: fake-project-id
      - name: Assert action ran (fails gracefully without valid Depot credentials)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (no valid Depot token/project)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
