name: Test - With Depot CLI installed, no valid token
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Depot CLI
        run: |
          if ! command -v depot > /dev/null 2>&1; then
            curl -L https://depot.dev/install-cli.sh | DEPOT_INSTALL_DIR=/usr/local/bin sh
          fi
          depot version

      - id: action
        uses: .
        with:
          files: tests/fixtures/docker-bake.hcl
          project: nonexistent-project-id
          token: invalid-token-for-testing
        continue-on-error: true

      - name: Assert action failed with auth/project error
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # With an invalid token and nonexistent project, depot bake should fail
          # with an authentication or project-not-found error
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid credentials, got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid depot credentials"
