name: Test - Set and targets inputs
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Depot CLI
        run: |
          if ! command -v depot > /dev/null 2>&1; then
            curl -L https://depot.dev/install-cli.sh | DEPOT_INSTALL_DIR=/usr/local/bin sh
          fi
          depot version

      - name: Set up Docker Buildx
        run: |
          docker buildx version
          docker buildx inspect --bootstrap || docker buildx create --use --bootstrap

      - id: action
        uses: .
        with:
          files: tests/fixtures/docker-bake-multi.hcl
          targets: 'app'
          set: 'app.output=type=tar,dest=/tmp/depot-bake-set-test.tar'
          buildx-fallback: 'true'
          project: nonexistent-project-id
          token: invalid-token-for-testing
        continue-on-error: true

      - name: Assert action ran with set and targets inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should attempt to run with set and targets inputs.
          # With invalid credentials, depot fails; buildx-fallback may succeed or fail.
          # Either outcome is acceptable as long as the action ran (not skipped).
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with set and targets inputs"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran and failed gracefully with set and targets inputs"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
