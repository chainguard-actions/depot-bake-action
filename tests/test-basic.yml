name: Test basic usage (no credentials)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create minimal docker-bake.hcl
        run: |
          cat > "$GITHUB_WORKSPACE/docker-bake.hcl" <<'EOF'
          group "default" {
            targets = ["app"]
          }

          target "app" {
            context = "."
            dockerfile-inline = "FROM alpine:3.18\nRUN echo hello"
            tags = ["app:test"]
          }
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          project: ''
          token: ''
          buildx-fallback: 'false'

      - name: Assert action ran (fails gracefully without Depot credentials)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (no Depot credentials)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
